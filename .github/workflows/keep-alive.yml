name: Keep Supabase Alive

on:
  schedule:
    - cron: '0 3,11,19 * * *'  # elke dag om 03:00, 11:00 en 19:00 UTC
  workflow_dispatch:

jobs:
  ping-database:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          curl -X GET "https://xigvwjjstmrcqdssknzz.supabase.co/rest/v1/artists?select=id&limit=1" \
          -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
          -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"
